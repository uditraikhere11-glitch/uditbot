name: DhanHQ v2 category governor - offline release gate
on:
  pull_request:
    paths:
      - 'src/broker/read_governor.py'
      - 'src/broker/dhan_client.py'
      - 'tests/test_dhan_category_governor.py'
      - 'tests/test_dhan_category_transport.py'
      - 'tests/test_r02_read_governor.py'
      - 'tests/test_r03_daily_health_reliability.py'
      - 'tests/test_historical_fill_reconciliation_h01_h17.py'
      - 'tests/test_safe_cancel_and_protection.py'
      - '.github/workflows/dhan-v2-category-governor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  category-release-tests:
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/tests/ci_offline:${{ github.workspace }}
    runs-on: ubuntu-latest
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - name: Compile new governor and Dhan transport
        run: python -B -m compileall -q src/broker/read_governor.py src/broker/dhan_client.py tests/test_dhan_category_governor.py tests/test_dhan_category_transport.py
      - name: API category and transport tests
        run: python -m unittest -v tests.test_dhan_category_governor tests.test_dhan_category_transport
      - name: Legacy governors and broker safety regressions
        run: |
          python -m unittest -q tests.test_r02_read_governor tests.test_r02_adaptive_watcher tests.test_r03_daily_health_reliability
          python -m unittest -q tests.test_safe_cancel_and_protection tests.test_historical_fill_reconciliation_h01_h17
