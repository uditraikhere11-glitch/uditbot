name: Execution modernization - isolated CI
on:
  push:
    branches:
      - dev/execution-modernization-20261121
  pull_request:
    paths:
      - 'run.py'
      - 'src/main.py'
      - 'src/engine/latency_monitor.py'
      - 'src/journal/db.py'
      - 'tools/benchmark_risk_journal.py'
      - 'src/engine/shadow_execution_events.py'
      - 'src/engine/typed_broker_evidence.py'
      - 'src/engine/delivery_sell_triage.py'
      - 'src/engine/broker_tradebook_preflight.py'
      - 'tools/benchmark_phase2_tradebook.py'
      - 'src/engine/deterministic_preparse.py'
      - 'src/engine/ordered_ingress.py'
      - 'src/engine/dhan_order_observer.py'
      - 'src/engine/dhan_order_update_shadow.py'
      - 'src/engine/shadow_event_ledger.py'
      - 'src/engine/telegram_event_metadata.py'
      - 'tools/execution_*.py'
      - 'tools/dhan_order_shadow_cli.py'
      - 'requirements-order-shadow.txt'
      - 'docs/execution-modernization/**'
      - 'tests/test_execution_modernization_*.py'
      - '.github/workflows/execution-modernization-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: execution-modernization-${{ github.ref }}
  # Newer development-branch tests supersede a stuck/outdated run.
  cancel-in-progress: true
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Enable offline network perimeter
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/tests/ci_offline:${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
      - name: Compile sources and standalone observer CLI
        run: python -B -m compileall -q run.py src tools tests
      - name: Focused modernization tests
        # A hung concurrency test is a failed safety gate, not a slow PASS.
        run: timeout --signal=TERM 40s python -u -W error::ResourceWarning -m unittest discover -s tests -t . -p 'test_execution_modernization_*.py' -v
      - name: Full offline regression suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -p 'test_*.py'
      - name: Offline matched parser/commit contention benchmark
        run: |
          python -B tools/execution_modernization_benchmark.py --count 120 --workers 8 --commit-delay-ms 2.0 > benchmark.json
          cat benchmark.json
          python - <<'PY'
          import json
          with open('benchmark.json',encoding='utf-8') as f:
              result=json.load(f)
          assert result['production_latency_improvement_proven'] is False
          assert result['count']==120
          PY
      - name: Benchmark indexed LIVE-risk journal queries against legacy SQL
        run: |
          python -B -m tools.benchmark_risk_journal --historical-fills 30000 --rounds 10 > journal_risk_benchmark.json
          cat journal_risk_benchmark.json
          python - <<'PY'
          import json
          with open('journal_risk_benchmark.json',encoding='utf-8') as f:
              result=json.load(f)
          assert result['risk_state_equivalent'] is True
          assert result['orders_submitted'] == 0
          assert result['production_latency_improvement_proven'] is False
          PY
      - name: Benchmark whole-book preflight cost
        run: |
          python -B -m tools.benchmark_phase2_tradebook --count 1000 --rounds 10 > phase2_preflight_benchmark.json
          cat phase2_preflight_benchmark.json
          python - <<'PY'
          import json
          with open('phase2_preflight_benchmark.json',encoding='utf-8') as f:
              report=json.load(f)
          assert report['synthetic_executions']==1000
          assert report['canonical_fill_writes_during_preflight']==0
          assert report['broker_requests']==0
          PY
      - name: Preserve anonymized benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: execution-modernization-synthetic-benchmark
          path: |
            benchmark.json
            journal_risk_benchmark.json
            phase2_preflight_benchmark.json
          retention-days: 14
