name: PR87 real systemd and authenticated staging
on:
  pull_request:
    paths:
      - 'src/engine/tracker_*'
      - 'src/engine/broker_handoff.py'
      - 'src/engine/webui_update.py'
      - 'src/control_center_entry.py'
      - 'src/control_center_backend.py'
      - 'tests/staging/**'
      - 'tests/test_tracker_v2_authenticated_acceptance.py'
      - '.github/workflows/tracker-v2-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-systemd-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Password and CSRF ASGI tests
        env:
          AUDITBOT_TEST_ISOLATION: '1'
        run: python -m unittest -v tests.test_tracker_v2_authenticated_acceptance
      - name: Start disposable synthetic TEST systemd unit
        run: |
          set -euo pipefail
          UNIT=uditbot-tracker-v2-staging.service
          DIR="$RUNNER_TEMP/uditbot-v2-staging"
          mkdir -m 700 -p "$DIR/data"
          printf 'DATA_DIR=%s\nTRADING_MODE=TEST\nDHAN_CLIENT_ID=STAGINGONLY1234\nEQUITY_BUDGET_INR=500\n' "$DIR/data" > "$DIR/.env"
          chmod 600 "$DIR/.env"
          PY="$(python -c 'import sys;print(sys.executable)')"
          cat > "$RUNNER_TEMP/$UNIT" <<EOF
          [Unit]
          Description=TEST-ONLY tracker V2 (no Dhan / Telegram)
          [Service]
          Type=simple
          User=$(id -un)
          WorkingDirectory=$GITHUB_WORKSPACE
          Environment=UDITBOT_TRACKER_V2_ENABLE=1
          Environment=PYTHONPATH=$GITHUB_WORKSPACE
          ExecStart=$PY -u $GITHUB_WORKSPACE/tests/staging/tracker_v2_dummy_service.py $DIR/.env $DIR/data
          Restart=no
          TimeoutStopSec=3
          EOF
          sudo install -m 644 "$RUNNER_TEMP/$UNIT" "/run/systemd/system/$UNIT"
          sudo systemctl daemon-reload
          sudo systemctl start "$UNIT"
          echo "UDITBOT_V2_TEST_DIR=$DIR" >> "$GITHUB_ENV"
          sudo systemctl show "$UNIT" --property=MainPID,ActiveState,SubState,Result
      - name: Actual systemd PID, single restart, late-ACK route
        env:
          UDITBOT_TRACKER_V2_ENABLE: '1'
          PYTHONPATH: .
        run: python -u tests/staging/tracker_v2_real_systemd.py "$UDITBOT_V2_TEST_DIR"
      - name: Remove disposable service
        if: always()
        run: |
          sudo systemctl stop uditbot-tracker-v2-staging.service || true
          sudo rm -f /run/systemd/system/uditbot-tracker-v2-staging.service
          sudo systemctl daemon-reload
