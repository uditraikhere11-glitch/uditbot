name: PR87 proposed offline regression and source bundle
on:
  push:
    branches:
      - proposed/pr87-governor-watcher-recovery-20261117
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDITBOT_TEST_ISOLATION: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated testing dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile and verify changed-file scope
        run: |
          python -B -m compileall -q run.py src tests
          git diff --check bd594af2e80b92f7ff0349971ba2f2f34150ab4d HEAD
      - name: Focused safety regressions
        run: |
          python -W error::ResourceWarning -m unittest -q             tests.test_r02_adaptive_watcher             tests.test_r02_read_governor             tests.test_historical_zero_trade_id_r01             tests.test_historical_fill_reconciliation_h01_h17
      - name: Full offline regression suite
        shell: bash
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee pr87-test-results.txt
      - name: Package six full changed source/test files and patch
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess, zipfile
          base='bd594af2e80b92f7ff0349971ba2f2f34150ab4d'
          names=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          names=[x for x in names if x!='.github/workflows/pr87-candidate-offline.yml']
          required={
            'src/broker/read_governor.py',
            'src/engine/protection_watcher.py',
            'src/engine/reconciliation.py',
            'tests/test_r02_adaptive_watcher.py'
          }
          assert set(names)==required, f'Unexpected PR87 file changes: {names}'
          result=pathlib.Path('pr87-test-results.txt').read_text()
          assert '\nOK\n' in result or '\nOK (skipped=' in result, 'Full tests not green'
          pkg='UDITBOT_PR87_Proposed_ChangedFiles.zip'
          patch='UDITBOT_PR87_Proposed.patch'
          with zipfile.ZipFile(pkg,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for path in sorted(names):
              z.write(path,path)
          with open(patch,'wb') as fh:
            subprocess.run(['git','diff','--binary','--full-index',base,'HEAD','--',*names],check=True,stdout=fh)
          manifest=[]
          for file in (pkg,patch,'pr87-test-results.txt'):
            contents=pathlib.Path(file).read_bytes()
            manifest.append(f'{hashlib.sha256(contents).hexdigest()}  {file}')
          manifest.append('BASE='+base)
          manifest.append('SOURCE_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          manifest.append('CHANGED_PATHS='+','.join(sorted(names)))
          pathlib.Path('PR87_SHA256SUMS.txt').write_text('\n'.join(manifest)+'\n')
          PY
      - name: Upload immutable proposal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr87-proposed-offline-source
          path: |
            UDITBOT_PR87_Proposed_ChangedFiles.zip
            UDITBOT_PR87_Proposed.patch
            PR87_SHA256SUMS.txt
            pr87-test-results.txt
          if-no-files-found: error
          retention-days: 30
