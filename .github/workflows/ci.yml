name: AuditBot V14 CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Verify & Regression Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      AUDITBOT_TEST_ISOLATION: "1"
      AUDITBOT_SKIP_SYSTEMCTL_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies in isolated venv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install httpx

      - name: Enforce release version, changelog, and manifest governance
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.base_ref }}" ]; then
            python -m src.version --verify --base-ref "origin/${{ github.base_ref }}"
          else
            python -m src.version --verify
          fi
          # Verify fail-closed rejection of invalid base ref
          if python -m src.version --verify --base-ref missing-do-not-exist-base-ref-987654321; then
            echo "ERROR: Invalid --base-ref unexpectedly succeeded"
            exit 1
          fi

      - name: Verify Python bytecode compilation & shell script syntax
        run: |
          python -B -m compileall -q run.py auditbot_dhan_readonly_order_probe.py src tests
          bash -n bot
          for sh_file in deploy/*.sh; do
            bash -n "$sh_file"
          done

      - name: Run independent release-blocker, merge-gate & network-isolation suites
        run: |
          python -W error::ResourceWarning -m unittest -v tests.test_auditbot_v14_release_blockers
          python -W error::ResourceWarning -m unittest -v tests.test_ab_v14_merge_gate_extra
          python -W error::ResourceWarning -m unittest -v tests.test_step23_step24

      - name: Run full regression test suite with ResourceWarning & offline network isolation check
        run: |
          python -W error::ResourceWarning -m unittest discover -s tests -p "test_*.py"
