name: AMO offline regression
on:
  pull_request:
  push:
    branches:
      - main
      - "feature/equity-amo-order-routing"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt 'httpx==0.28.1'
      - name: BRAIN company-name regression
        run: python -m unittest -v tests.test_brain_multiword_company_priority tests.test_darvas_merged_features tests.test_equity_parser tests.test_brain_validation
      - name: AMO regressions
        run: python -m unittest -v tests.test_equity_amo
      - name: Existing offline suite
        if: always()
        run: python -m unittest discover -s tests -p "test_*.py"
