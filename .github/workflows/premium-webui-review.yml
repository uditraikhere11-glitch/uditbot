name: AuditBot premium WebUI review bundle

on:
  pull_request:
    paths:
      - 'src/setup_app.py'
      - 'src/control_center_ui.py'
      - 'src/notifier/message_designer_ui.py'
      - 'src/premium_ui.*'
      - 'src/approved_replica.*'
      - 'tests/test_approved_replica_contract.py'
      - 'tests/test_premium_ui_contract.py'
      - 'tests/premium_ui_browser_smoke.py'
      - '.github/workflows/premium-webui-review.yml'

permissions:
  contents: read

jobs:
  ui-review-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Verify premium UI syntax and contracts
        run: |
          python -m compileall -q src/premium_ui.py src/setup_app.py src/control_center_ui.py src/notifier/message_designer_ui.py
          python -m unittest -v tests.test_premium_ui_contract tests.test_control_center_ui_contract tests.test_message_designer tests.test_approved_replica_contract
          git diff --check -- . ':!src/setup_app.py'
          python -m unittest -v tests.test_approved_replica_contract
      - name: Run real-browser presentation and status truth smoke (offline)
        run: |
          python -m pip install "playwright>=1.50,<2.0"
          python -m playwright install chromium
          PYTHONPATH=. python tests/premium_ui_browser_smoke.py
      - name: Classify UI-only PR packaging scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          allowed = {
              'src/setup_app.py', 'src/control_center_ui.py', 'src/notifier/message_designer_ui.py',
              'src/premium_ui.py', 'src/premium_ui.css', 'src/premium_ui.js',
              'src/approved_replica.css', 'src/approved_replica.js',
              'tests/test_premium_ui_contract.py', 'tests/premium_ui_browser_smoke.py', 'tests/test_approved_replica_contract.py',
              'tests/test_webui_integrated_acceptance.py', 'tests/test_webui_reliability_remaining.py',
              '.github/workflows/premium-webui-review.yml',
          }
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          paths = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, head], text=True
          ).splitlines())
          ui_only = bool(paths) and paths.issubset(allowed)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('ui_only=' + str(ui_only).lower() + '\n')
          if not ui_only:
              print('Mixed-scope PR: premium UI tests ran; the UI-only artifact gate is not applicable.')
              print('The shared retirement release workflow packages the complete changed-files diff.')
          PY
      - name: Create exact changed-files ZIP and independent patch
        if: steps.scope.outputs.ui_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          from zipfile import ZipFile, ZIP_DEFLATED

          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == head, f'Head mismatch: {actual} != {head}'
          subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'], check=True)
          # For a broad infrastructure PR, validate the *only* authorized
          # Setup change (removal of a dead legacy writer import), without
          # claiming that the UI-only ZIP builder can package infrastructure.
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
          allowed = ('src/setup_app.py', 'src/control_center_ui.py', 'src/notifier/message_designer_ui.py',
                     'src/premium_ui.py', 'src/premium_ui.css', 'src/premium_ui.js',
                     'src/approved_replica.css', 'src/approved_replica.js',
                     'tests/test_premium_ui_contract.py', 'tests/premium_ui_browser_smoke.py', 'tests/test_approved_replica_contract.py', 'tests/test_webui_integrated_acceptance.py',
                     'tests/test_webui_reliability_remaining.py', '.github/workflows/premium-webui-review.yml')
          if set(paths) - set(allowed):
              before = subprocess.check_output(['git', 'show', base + ':src/setup_app.py'])
              after = subprocess.check_output(['git', 'show', head + ':src/setup_app.py'])
              expected = before.replace(b'    execute_configuration_update,\\n', b'', 1)
              assert b'    execute_configuration_update,\\n' in before, 'Unexpected Setup baseline'
              assert expected == after, 'Working Setup altered beyond obsolete import removal'
              out = Path('review-out')
              out.mkdir(exist_ok=True)
              (out / 'UI_CONTRACT_ONLY.txt').write_text(
                  'Mixed infrastructure PR: premium UI tests passed; Setup change limited to removal '
                  'of obsolete legacy-writer import. Source ZIP supplied by dedicated retirement workflow.\\n',
                  encoding='utf-8')
              raise SystemExit(0)
          # UI edits may change the Setup HTML; enforce the original POST contract
          # and prevent every backend Python AST change instead of pinning a blob.
          import ast
          import re
          before_src = subprocess.check_output(['git', 'show', base + ':src/setup_app.py'], text=True)
          after_src = Path('src/setup_app.py').read_text(encoding='utf-8')
          def inspected(source):
              tree = ast.parse(source)
              declarations = [node for node in tree.body
                              if isinstance(node, ast.Assign) and any(
                                  isinstance(target, ast.Name) and target.id == 'HTML_TEMPLATE'
                                  for target in node.targets)]
              assert len(declarations) == 1, 'Missing or duplicated Setup HTML_TEMPLATE'
              template = ast.literal_eval(declarations[0].value)
              assert template.count('<form method="POST" action="/setup">') == 1, 'Setup form contract changed'
              form = template.split('<form method="POST" action="/setup">', 1)[1].split('</form>', 1)[0]
              names = re.findall(r'<(?:input|select|textarea)[^>]*name="([^"]+)"', form)
              assert len(names) == len(set(names)) == 54, 'Setup field count or uniqueness changed'
              required = {'csrf_token', 'expected_revision', 'full_setup_form', 'confirm_live',
                          'is_live_mode', 'equity_active', 'fno_active'}
              assert required.issubset(names), 'Safety or native toggle fields missing'
              for key in ('is_live_mode', 'equity_active', 'fno_active'):
                  tag = re.search(r'<input[^>]*name="' + key + r'"[^>]*>', form)
                  assert tag and 'type="checkbox"' in tag.group() and 'value="true"' in tag.group(), key
              assert 'class="slider"' not in template and 'class="switch"' not in template
              # Allow HTML string edits only: controllers, validation and routes stay identical.
              declarations[0].value = ast.Constant(value='PRESENTATION_ONLY_HTML')
              return names, ast.dump(tree, include_attributes=False)
          before_names, before_backend = inspected(before_src)
          after_names, after_backend = inspected(after_src)
          assert before_names == after_names, 'Native Setup field names/order changed'
          assert before_backend == after_backend, 'Backend Setup Python changed'
          subprocess.run(['git', 'diff', '--check', base, head], check=True)
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
          assert paths, 'No changes to package'
          allowed = ('src/setup_app.py', 'src/control_center_ui.py', 'src/notifier/message_designer_ui.py',
                     'src/premium_ui.py', 'src/premium_ui.css', 'src/premium_ui.js',
                     'src/approved_replica.css', 'src/approved_replica.js',
                     'tests/test_premium_ui_contract.py', 'tests/premium_ui_browser_smoke.py', 'tests/test_approved_replica_contract.py', 'tests/test_webui_integrated_acceptance.py',
                     'tests/test_webui_reliability_remaining.py', '.github/workflows/premium-webui-review.yml')
          assert set(paths).issubset(allowed), f'Unexpected changed file(s): {set(paths) - set(allowed)}'
          manifest = {'pr': int(os.environ['PR_NUMBER']), 'base': base, 'head': head, 'files': {}, 'removed_files': []}
          out = Path('review-out')
          out.mkdir(exist_ok=True)
          zip_path = out / ('AuditBot_PR' + os.environ['PR_NUMBER'] + '_ChangedFiles.zip')
          with ZipFile(zip_path, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
              for path in paths:
                  file = Path(path)
                  if not file.exists():
                      assert path in ('src/approved_replica.css', 'src/approved_replica.js')
                      subprocess.run(['git', 'cat-file', '-e', base + ':' + path], check=True)
                      manifest['removed_files'].append(path)
                      continue
                  assert file.is_file() and not file.is_symlink(), f'Unsafe file: {path}'
                  raw = file.read_bytes()
                  manifest['files'][path] = hashlib.sha256(raw).hexdigest()
                  archive.write(file, path)
              archive.writestr('MANIFEST.json', json.dumps(manifest, indent=2, sort_keys=True))
          patch_path = out / 'AuditBot_PR_Complete_Review.patch'
          with patch_path.open('wb') as stream:
              subprocess.run(['git', 'diff', '--binary', '--full-index', base, head],
                             stdout=stream, check=True)
          (out / 'AUDIT.txt').write_text(
              'Exact pull request changed-files package.\n'
              f'PR: {manifest["pr"]}\nBASE: {base}\nHEAD: {head}\n'
              'No broker/order execution/state migration changes are included.\n'
              'Review CI before merge; this package does not deploy or restart services.\n',
              encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.ui_only == 'true'
        with:
          name: AuditBot-Premium-UI-PR-${{ github.event.pull_request.number }}-ChangedFiles
          path: review-out/*
          if-no-files-found: error
          retention-days: 30