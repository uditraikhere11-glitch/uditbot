name: AuditBot premium WebUI review bundle

on:
  pull_request:
    paths:
      - 'src/setup_app.py'
      - 'src/control_center_ui.py'
      - 'src/notifier/message_designer_ui.py'
      - 'src/premium_ui.*'
      - 'src/approved_replica.*'
      - 'tests/test_approved_replica_contract.py'
      - 'tests/test_premium_ui_contract.py'
      - '.github/workflows/premium-webui-review.yml'

permissions:
  contents: read

jobs:
  ui-review-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Verify premium UI syntax and contracts
        run: |
          python -m compileall -q src/premium_ui.py src/setup_app.py src/control_center_ui.py src/notifier/message_designer_ui.py
          python -m unittest -v tests.test_premium_ui_contract tests.test_control_center_ui_contract tests.test_message_designer tests.test_approved_replica_contract
          git diff --check
      - name: Create exact changed-files ZIP and independent patch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          from zipfile import ZipFile, ZIP_DEFLATED

          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == head, f'Head mismatch: {actual} != {head}'
          subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'], check=True)
          # The exact pre-replica Setup source has one historical whitespace line.
          # Pin its entire Git blob instead of editing any working input or handler.
          setup_blob = subprocess.check_output(
              ['git', 'rev-parse', head + ':src/setup_app.py'], text=True).strip()
          assert setup_blob == 'c8a81e63d3045229c97cbe7e5f58085b2395e6bf', (
              'Setup source differs from verified pre-replica working code')
          subprocess.run(['git', 'diff', '--check', base, head, '--', '.',
                          ':(exclude)src/setup_app.py'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
          assert paths, 'No changes to package'
          allowed = ('src/setup_app.py', 'src/control_center_ui.py', 'src/notifier/message_designer_ui.py',
                     'src/premium_ui.py', 'src/premium_ui.css', 'src/premium_ui.js',
                     'src/approved_replica.css', 'src/approved_replica.js',
                     'tests/test_premium_ui_contract.py', 'tests/test_approved_replica_contract.py', 'tests/test_webui_integrated_acceptance.py',
                     'tests/test_webui_reliability_remaining.py', '.github/workflows/premium-webui-review.yml')
          assert set(paths).issubset(allowed), f'Unexpected changed file(s): {set(paths) - set(allowed)}'
          manifest = {'pr': int(os.environ['PR_NUMBER']), 'base': base, 'head': head,
                      'files': {}, 'removed_files': []}
          out = Path('review-out')
          out.mkdir(exist_ok=True)
          zip_path = out / ('AuditBot_PR' + os.environ['PR_NUMBER'] + '_ChangedFiles.zip')
          with ZipFile(zip_path, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
              for path in paths:
                  file = Path(path)
                  if not file.exists():
                      # UI-only removal of obsolete, unreferenced proxy assets.
                      assert path in ('src/approved_replica.css', 'src/approved_replica.js')
                      subprocess.run(['git', 'cat-file', '-e', base + ':' + path], check=True)
                      assert subprocess.run(['git', 'cat-file', '-e', head + ':' + path],
                                            stdout=subprocess.DEVNULL,
                                            stderr=subprocess.DEVNULL).returncode != 0
                      manifest['removed_files'].append(path)
                      continue
                  assert file.is_file() and not file.is_symlink(), f'Unsafe file: {path}'
                  raw = file.read_bytes()
                  manifest['files'][path] = hashlib.sha256(raw).hexdigest()
                  archive.write(file, path)
              archive.writestr('MANIFEST.json', json.dumps(manifest, indent=2, sort_keys=True))
          patch_path = out / 'AuditBot_PR_Complete_Review.patch'
          with patch_path.open('wb') as stream:
              subprocess.run(['git', 'diff', '--binary', '--full-index', base, head],
                             stdout=stream, check=True)
          (out / 'AUDIT.txt').write_text(
              'Exact pull request changed-files package.\n'
              f'PR: {manifest["pr"]}\nBASE: {base}\nHEAD: {head}\n'
              'No broker/order execution/state migration changes are included.\n'
              'Review CI before merge; this package does not deploy or restart services.\n',
              encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AuditBot-Premium-UI-PR-${{ github.event.pull_request.number }}-ChangedFiles
          path: review-out/*
          if-no-files-found: error
          retention-days: 30