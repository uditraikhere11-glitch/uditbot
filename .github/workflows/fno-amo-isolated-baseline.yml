name: Isolated FNO AMO baseline snapshot
on:
  push:
    branches:
      - feature/uditbot-fno-native-amo-dev
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source
        run: |
          git archive --format=tar HEAD | gzip -9 > uditbot-source.tar.gz
          git rev-parse HEAD > baseline_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fno-amo-isolated-source
          path: |
            uditbot-source.tar.gz
            baseline_sha.txt
          retention-days: 1
