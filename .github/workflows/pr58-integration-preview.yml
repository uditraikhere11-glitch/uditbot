name: Isolated PR58 Safety Integration Preview
on:
  push:
    branches:
      - integration/pr58-safety-on-p0-preview-20261106
permissions:
  contents: read
jobs:
  integration-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'httpx==0.28.1'
      - run: python -m unittest -v tests.test_equity_amo
      - run: python -m unittest discover -s tests -p 'test_*.py'
