name: Telegram designer offline tests
on:
  push:
    branches:
      - "feature/telegram-message-designer-custom-emojis-20261105"
  pull_request:
    paths:
      - "src/notifier/**"
      - "src/main.py"
      - "src/setup_app.py"
      - "tests/test_message_designer.py"
      - ".github/workflows/telegram-message-designer.yml"

permissions:
  contents: read

jobs:
  designer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt 'httpx==0.28.1'
      - name: Compile imported modules
        run: python -m compileall -q src/notifier src/main.py src/setup_app.py
      - name: Customization and existing acknowledgement tests
        run: python -m unittest -v tests.test_message_designer tests.test_dhan_amo_ack_response
