name: V2 activation release safety (opt-in; never LIVE)
on:
  pull_request:
    paths:
      - 'deploy/tracker_v2_activation.sh'
      - 'deploy/tracker_v2_preflight.py'
      - 'src/engine/tracker_v2_dual_service.py'
      - 'src/engine/tracker_v2_health.py'
      - 'src/engine/webui_update.py'
      - 'src/control_center_backend.py'
      - 'tests/test_tracker_v2_activation_preflight.py'
      - 'tests/test_tracker_v2_activation_script.py'
      - 'tests/test_tracker_v2_dual_service.py'
      - 'tests/test_tracker_v2_health.py'
      - 'tests/test_tracker_v2_source_replacements.py'
      - '.github/workflows/tracker-v2-activation-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activation-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies for existing tracker regression
        run: python -m pip install -r requirements-test.txt
      - name: Bash and Python syntax
        run: |
          bash -n deploy/tracker_v2_activation.sh
          python -m compileall -q deploy/tracker_v2_preflight.py src/engine/tracker_v2_dual_service.py src/engine/tracker_v2_health.py
      - name: V2 activation and routing negative tests
        env:
          AUDITBOT_TEST_ISOLATION: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest -v tests.test_tracker_v2_health tests.test_tracker_v2_dual_service tests.test_tracker_v2_activation_preflight tests.test_tracker_v2_activation_script tests.test_tracker_v2_source_replacements
      - name: Existing tracker review suite with VM-like umask
        env:
          AUDITBOT_TEST_ISOLATION: '1'
        run: |
          umask 0002
          python -m unittest -q tests.test_tracker_v2_review tests.test_tracker_v2_stress_matrix
      - name: Authenticated setup, CSRF and V2 acceptance
        env:
          AUDITBOT_TEST_ISOLATION: '1'
        run: python -m unittest -v tests.test_tracker_v2_authenticated_acceptance
