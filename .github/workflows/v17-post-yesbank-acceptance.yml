name: V17 post-YESBANK visual acceptance (offline)
on:
  push:
    branches: [dev/uditbot-v17-post-yesbank-visual-acceptance-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared test dependencies and Chromium (before offline perimeter)
        run: |
          python -m pip install -r requirements-test.txt 'pytest>=8,<10' 'playwright>=1.48,<1.60'
          python -m playwright install --with-deps chromium
      - name: Enable network-isolated test imports
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/tests/ci_offline:${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
      - name: Native V17 Setup + operational + visual contracts
        shell: bash
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest -v \
            tests.test_v17_native_49_persistence \
            tests.test_v17_operational_runtime \
            tests.test_v17_workspace_contract \
            tests.test_v17_personalized_presentation \
            tests.test_v17_setup_category_contract \
            tests.test_v17_production_snapshot_runner \
            tests.test_v17_restart_ack_window \
            2>&1 | tee v17-targeted-tests.log
      - name: Actual native FastAPI desktop and iPhone visual captures
        shell: bash
        run: |
          set -o pipefail
          V17_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" \
          V17_WORKSPACE_EVIDENCE_DIR="${GITHUB_WORKSPACE}/v17-workspace-evidence" \
          python tools/v17_workspace_acceptance.py 2>&1 | tee v17-visual-captures.log
      - name: Full offline integration regression
        shell: bash
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -t . -p 'test_*.py' \
            2>&1 | tee v17-full-suite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V17-post-YESBANK-visual-and-functional-evidence
          path: |
            v17-workspace-evidence/
            v17-targeted-tests.log
            v17-visual-captures.log
            v17-full-suite.log
          retention-days: 14
