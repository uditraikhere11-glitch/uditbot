name: Python 3.14 Telethon runner compatibility

on:
  pull_request:
    paths:
      - "run.py"
      - "requirements.txt"
      - "tests/test_python314_runner_loop.py"
      - "tests/test_run_entrypoint_dhan_response.py"
      - ".github/workflows/python314-runner.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install declared dependencies and test client
        run: python -m pip install -r requirements.txt 'httpx==0.28.1'

      - name: Python event-loop and Dhan Response production-runner tests
        run: |
          python -m unittest -v tests.test_python314_runner_loop tests.test_run_entrypoint_dhan_response
          python -B -m compileall -q run.py src tests

      - name: Existing offline suite on supported production Python
        if: matrix.python-version == '3.12'
        run: python -m unittest discover -s tests -p "test_*.py"
