name: R03 proposed offline Dhan health candidate
on:
  push:
    branches:
      - proposed/r03-r17-dhan-health-reliability-20261117
permissions:
  contents: read
jobs:
  offline-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Scope, compile and offline test
        run: |
          git diff --check a9c00672634d404296b5a3d339c2061708369f87 HEAD
          python -B -m compileall -q run.py src tests
          python -W error::ResourceWarning -m unittest -v tests.test_r03_daily_health_reliability tests.test_r02_read_governor tests.test_dhan_1700_ist_final
          python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py'
      - name: Freeze proposed changed-files ZIP and patch
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist/payload
          for p in             src/broker/dhan_client.py             src/broker/read_governor.py             src/cli.py             tests/test_r02_read_governor.py             tests/test_r03_daily_health_reliability.py; do
            mkdir -p "dist/payload/$(dirname "$p")"
            cp "$p" "dist/payload/$p"
          done
          (cd dist/payload && zip -q -r ../UDITBOT_R03_R17_Gemini_Proposed_ChangedFiles.zip src tests)
          git diff a9c00672634d404296b5a3d339c2061708369f87 HEAD --             src/broker/dhan_client.py             src/broker/read_governor.py             src/cli.py             tests/test_r02_read_governor.py             tests/test_r03_daily_health_reliability.py             > dist/UDITBOT_R03_R17_Gemini_Proposed.patch
          rm -rf dist/payload
          (cd dist && sha256sum UDITBOT_R03_R17_Gemini_Proposed_ChangedFiles.zip UDITBOT_R03_R17_Gemini_Proposed.patch > SHA256SUMS.txt)
          git rev-parse HEAD > dist/HEAD_SHA.txt
          echo a9c00672634d404296b5a3d339c2061708369f87 > dist/BASE_SHA.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: R03-R17-proposed-verified
          path: dist/
          retention-days: 30
