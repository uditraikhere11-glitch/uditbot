name: Shared broker fence and settings-retirement review (offline)
on:
  push:
    branches:
      - review/shared-config-retirement-fence-20261120
  pull_request:
    paths:
      - 'src/engine/**'
      - 'src/broker/dhan_client.py'
      - 'src/control_center_backend.py'
      - 'src/main.py'
      - 'tests/**'
      - 'tools/audit_tracker_retirement.py'
      - '.github/workflows/tracker-a01-a11-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Prove obsolete writers are absent and broker fence exists
        run: python tools/audit_tracker_retirement.py --mode release
      - name: Compile the current (not legacy) settings and broker paths
        run: python -m compileall -q src/engine/config_manager.py src/engine/simple_save_apply.py src/engine/prior_restart_recovery.py src/engine/broker_handoff.py src/engine/prior_settings.py src/engine/runtime_evidence.py src/control_center_backend.py src/broker/dhan_client.py src/engine/orphan_cleanup.py src/main.py
      - name: Isolated Owner STOP and late restart readback
        run: |
          python -m unittest -q tests.test_tracker_retirement_owner_stop tests.test_prior_restart_recovery_offline
          python -m unittest -q tests.test_always_on_broker_fence_retirement tests.test_tracker_broker_handoff tests.test_orphan_oco_cleanup
      - name: Save and apply and safety regressions
        run: |
          python -m unittest -q tests.test_simple_save_apply tests.test_pr98_stale_recovery tests.test_settings_host_migration
          python -m unittest -q tests.test_control_center_step2 tests.test_tracker_v2_authenticated_acceptance
      - name: Package exact changed-files review artifact
        run: |
          python tools/package_retirement_review.py --base 34f72ca89564fc2c9f2ba7db1a7b4f0e534801a0 --output /tmp/uditbot-tracker-retirement-review.zip
      - name: Upload source-only review package
        uses: actions/upload-artifact@v4
        with:
          name: UditBot-AmanBot-tracker-retirement-changed-files
          path: /tmp/uditbot-tracker-retirement-review.zip
          if-no-files-found: error
  full-offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run complete offline unit-test discovery (external network prohibited)
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/ci_offline:${{ github.workspace }}
        run: |
          python - <<'PY'
          import socket
          try:
              socket.getaddrinfo("api.dhan.co", 443)
          except socket.gaierror as exc:
              assert "OFFLINE_TEST" in str(exc), str(exc)
          else:
              raise SystemExit("External DNS guard is not installed")
          PY
          python -m unittest discover -s tests -t . -p 'test_*.py' -q
