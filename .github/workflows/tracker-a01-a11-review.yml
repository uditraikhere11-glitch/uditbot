name: Tracker A01-A11 candidate isolation and regressions
on:
  pull_request:
    paths:
      - 'src/engine/tracker_*'
      - 'tests/test_tracker_*'
      - 'src/engine/simple_save_apply.py'
      - 'src/engine/runtime_evidence.py'
      - 'src/engine/prior_settings.py'
      - 'src/engine/broker_handoff.py'
      - 'src/control_center_backend.py'
      - 'src/main.py'
      - 'src/broker/dhan_client.py'
      - 'deploy/backup_runtime.sh'
      - 'deploy/restore_runtime.sh'
      - 'run.py'
      - 'tests/test_settings_host_migration.py'
      - '.github/workflows/tracker-a01-a11-review.yml'
  workflow_dispatch:
jobs:
  tracker-isolation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing repository dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Syntax verification
        run: python -m compileall -q src/engine/runtime_evidence.py src/engine/prior_settings.py src/engine/tracker_v2_candidate.py src/engine/tracker_v2_safety.py src/engine/broker_handoff.py src/engine/tracker_credentials.py src/engine/tracker_v2_integration.py
      - name: Review-only offline regressions
        env:
          AUDITBOT_TEST_ISOLATION: '1'
        run: |
          python -m unittest -v tests.test_settings_host_migration tests.test_simple_save_apply tests.test_pr98_stale_recovery tests.test_vm_rebuild_deployment.VMRebuildDeploymentTests.test_end_to_end_encrypted_backup_and_restore_roundtrip
          python -m unittest discover -s tests -p 'test_tracker*.py' -v
      - name: VM-like permissive umask 0002 tracker regression
        env:
          AUDITBOT_TEST_ISOLATION: '1'
        run: |
          umask 0002
          python -m unittest -q tests.test_tracker_v2_review tests.test_tracker_v2_stress_matrix
