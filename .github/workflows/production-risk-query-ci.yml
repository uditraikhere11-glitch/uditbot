name: Production risk journal SQL - isolated release gate
on:
  push:
    branches:
      - perf/production-risk-query-20261121
  pull_request:
    paths:
      - 'src/journal/db.py'
      - 'tools/benchmark_risk_journal.py'
      - 'tools/measure_risk_query_snapshot.py'
      - 'tests/test_execution_modernization_journal_risk.py'
      - 'tests/test_execution_modernization_snapshot_benchmark.py'
      - '.github/workflows/production-risk-query-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prod-risk-query-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-risk-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDITBOT_TEST_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Enforce offline network perimeter
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/tests/ci_offline:${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
      - name: Compile production journal and measurement tools
        run: python -B -m compileall -q src/journal/db.py tools/benchmark_risk_journal.py tools/measure_risk_query_snapshot.py tests
      - name: Exact risk-state parity, fail-closed tests, and snapshot safety
        run: timeout 40s python -u -W error::ResourceWarning -m unittest discover -s tests -t . -p 'test_execution_modernization_*.py' -v
      - name: Full UditBot offline regression suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -p 'test_*.py'
      - name: Real JournalDB synthetic risk-query benchmark
        run: |
          python -B -m tools.benchmark_risk_journal --historical-fills 30000 --rounds 10 > journal_risk_benchmark.json
          cat journal_risk_benchmark.json
          python - <<'PY'
          import json
          with open('journal_risk_benchmark.json',encoding='utf-8') as f:
              result=json.load(f)
          assert result['risk_state_equivalent'] is True
          assert result['orders_submitted'] == 0
          assert result['production_latency_improvement_proven'] is False
          PY
      - name: Store anonymized benchmark (no account or order IDs)
        uses: actions/upload-artifact@v4
        with:
          name: production-risk-query-benchmark
          path: journal_risk_benchmark.json
          retention-days: 14
